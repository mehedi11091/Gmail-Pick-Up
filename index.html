<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gmail Picker</title>
<style>
:root{--bg:#0f0a25;--bg2:#1b1245;--g1:rgba(255,77,141,.35);--g2:rgba(34,211,238,.28);--g3:rgba(124,92,255,.4);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#f4f1ff;--mut:#a8a0d4;--a:#ff4d8d;--b:#7c5cff;--c:#22d3ee;--d:#ffb547;--ok:#34e0a1;--bad:#ff6b6b;--nav:rgba(20,12,60,.85);--navtx:#cfc8ff;--inp:rgba(0,0,0,.2);--chip:#06223a}
[data-theme="light"]{--bg:#f4f1ff;--bg2:#e2d9ff;--g1:rgba(255,77,141,.22);--g2:rgba(34,211,238,.22);--g3:rgba(124,92,255,.25);--card:rgba(255,255,255,.85);--line:rgba(60,40,140,.18);--tx:#1d1442;--mut:#5f5890;--nav:rgba(255,255,255,.9);--navtx:#4b3f8f;--inp:rgba(255,255,255,.8)}
[data-theme="ocean"]{--bg:#041a2e;--bg2:#06324f;--g1:rgba(0,194,255,.35);--g2:rgba(45,212,191,.28);--g3:rgba(37,99,235,.4);--a:#00c2ff;--b:#2563eb;--c:#2dd4bf;--d:#7dd3fc;--nav:rgba(4,26,46,.88);--navtx:#a5d8ff}
[data-theme="sunset"]{--bg:#2a0a1a;--bg2:#4a1230;--g1:rgba(255,94,98,.38);--g2:rgba(255,209,102,.25);--g3:rgba(255,143,171,.3);--a:#ff5e62;--b:#ff8a4c;--c:#ffd166;--d:#ff8fab;--nav:rgba(42,10,26,.88);--navtx:#ffc9b8;--chip:#3a1020}
[data-theme="forest"]{--bg:#07200f;--bg2:#0e3a1c;--g1:rgba(52,211,153,.32);--g2:rgba(163,230,53,.25);--g3:rgba(22,163,74,.4);--a:#10b981;--b:#16a34a;--c:#84cc16;--d:#fde047;--nav:rgba(7,32,15,.9);--navtx:#bbf7d0;--chip:#07200f}
[data-theme="neon"]{--bg:#0a0014;--bg2:#1a0033;--g1:rgba(255,0,229,.35);--g2:rgba(0,240,255,.3);--g3:rgba(123,44,255,.45);--a:#ff00e5;--b:#7b2cff;--c:#00f0ff;--d:#f5ff00;--nav:rgba(10,0,20,.9);--navtx:#e0b8ff;--chip:#1a0033}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Poppins","Segoe UI",system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 10% -10%,var(--g1),transparent 60%),radial-gradient(800px 500px at 100% 0,var(--g2),transparent 55%),radial-gradient(900px 600px at 50% 110%,var(--g3),transparent 60%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 100px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--d));display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px var(--g1)}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.3px}
header p{margin:0;color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{border-radius:18px;padding:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.stat.s1{background:linear-gradient(135deg,var(--b),var(--c))}
.stat.s2{background:linear-gradient(135deg,var(--a),var(--d))}
.stat b{font-size:34px;display:block;line-height:1}
.stat span{font-size:12.5px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
textarea{width:100%;min-height:120px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--tx);padding:12px;font:inherit;font-size:14px}
textarea:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;color:#fff;transition:transform .12s;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.btn:active{transform:scale(.97)}
.add{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--b),var(--c))}
.gen{width:100%;padding:18px;font-size:18px;background:linear-gradient(135deg,var(--a),var(--d));box-shadow:0 12px 30px var(--g1)}
.gen:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.result{margin-top:14px;border-radius:18px;padding:18px;text-align:center;border:1px dashed var(--line);min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.result .em{font-size:17px;font-weight:800;word-break:break-all;background:linear-gradient(90deg,var(--c),var(--ok),var(--d));-webkit-background-clip:text;background-clip:text;color:transparent}
.result.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.result.pop{animation:none}}
.mut{color:var(--mut);font-size:13px}
.copy{background:var(--line);color:var(--tx);padding:8px 14px;font-size:13px;text-shadow:none}
.msg{margin-top:10px;font-size:13px;font-weight:600;min-height:18px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--inp);border:1px solid var(--line);margin-bottom:8px}
.item .n{font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--a));color:#fff}
.item .t{flex:1;font-size:14px;word-break:break-all}
.item.latest{border-color:var(--ok)}
.ib{border:0;background:var(--line);color:var(--tx);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:130px}
.warn{background:linear-gradient(135deg,#ff6b6b,#e11d48)}
.alt{background:linear-gradient(135deg,var(--b),var(--c))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;border-radius:22px;background:var(--nav);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.35);width:min(380px,calc(100% - 28px))}
.tab{flex:1;border:0;border-radius:16px;padding:12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:var(--navtx)}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.logo svg{width:26px;height:26px;color:#fff}.menu .ic svg{width:22px;height:22px}.tab svg{width:18px;height:18px;margin-right:6px;vertical-align:-.2em}.ib svg{width:16px;height:16px;vertical-align:middle}.gen svg{width:22px;height:22px;margin-right:4px}.back svg{width:14px;height:14px}.menu .ar svg{width:18px;height:18px}
.page{display:none}.page.on{display:block}
.sub{display:none}.sub.on{display:block}
h2{font-size:16px;margin:0 0 4px}
.count{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:99px;background:linear-gradient(135deg,var(--c),var(--ok));color:var(--chip);font-size:12px;font-weight:800}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;font:inherit;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.menu .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;color:#fff;flex:none}
.menu .tt{flex:1}.menu .tt b{display:block;font-size:15px}.menu .tt span{font-size:12.5px;color:var(--mut)}
.menu .ar{color:var(--mut);font-size:20px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 14px;border-radius:12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:14px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.th{border:2px solid var(--line);border-radius:16px;padding:10px;background:transparent;cursor:pointer;color:var(--tx);font:inherit;text-align:left}
.th i{display:block;height:44px;border-radius:10px;margin-bottom:8px}
.th b{font-size:13.5px}
.th.on{border-color:var(--ok);box-shadow:0 0 0 3px var(--g3)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><div><h1>Gmail Picker</h1><p>Add, generate, track — no repeats</p></div></header>

<section class="page on" id="home">
 <div class="stats">
  <div class="stat s1"><b id="avail">0</b><span>Gmail available</span></div>
  <div class="stat s2"><b id="shownCount">0</b><span>Gmail showed</span></div>
 </div>
 <div class="card">
  <button class="btn gen" id="genBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> Generate</button>
  <div class="result" id="result"><span class="mut" id="ph">Your Gmail will appear here</span></div>
 </div>
</section>

<section class="page" id="settings">
 <div class="sub on" id="v-menu">
  <button class="menu" data-open="add"><span class="ic" style="background:linear-gradient(135deg,var(--b),var(--c))"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="tt"><b>Add Gmail</b><span>Add new addresses to the list</span></span><span class="ar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
  <button class="menu" data-open="showed"><span class="ic" style="background:linear-gradient(135deg,var(--a),var(--d))"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="tt"><b>Showed Gmail</b><span id="m-sc">0 showed, latest on top</span></span><span class="ar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
  <button class="menu" data-open="avail"><span class="ic" style="background:linear-gradient(135deg,var(--c),var(--ok))"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span class="tt"><b>Available Gmail</b><span id="m-ac">0 waiting</span></span><span class="ar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
  <button class="menu" data-open="theme"><span class="ic" style="background:linear-gradient(135deg,var(--d),var(--a))"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.5-1.9-.3-1 .4-2.1 1.5-2.1H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><path d="M7.5 11h.01M10 7.5h.01M14 7.5h.01M16.5 11h.01"/></svg></span><span class="tt"><b>Theme</b><span id="m-th">Dark</span></span><span class="ar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
  <button class="menu" data-open="manage"><span class="ic" style="background:linear-gradient(135deg,#ff6b6b,#e11d48)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h9m4 0h5M3 12h3m4 0h11M3 18h11m4 0h3"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg></span><span class="tt"><b>Manage lists</b><span>Reset, restore, clear</span></span><span class="ar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
 </div>

 <div class="sub" id="v-add">
  <button class="back" data-open="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> Settings</button>
  <div class="card">
   <label for="inp">Add Gmail addresses</label>
   <textarea id="inp" placeholder="name@domain.com&#10;One per line, or separate with commas / spaces"></textarea>
   <button class="btn add" id="addBtn">Add to list</button>
   <div class="msg" id="msg" role="status"></div>
  </div>
 </div>

 <div class="sub" id="v-showed">
  <button class="back" data-open="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> Settings</button>
  <div class="card">
   <h2>Showed Gmail <span class="count" id="sc">0</span></h2>
   <p class="mut" style="margin:0 0 12px">Latest shown is on top.</p>
   <div id="showedList"></div>
  </div>
 </div>

 <div class="sub" id="v-avail">
  <button class="back" data-open="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> Settings</button>
  <div class="card">
   <h2>Available Gmail <span class="count" id="ac">0</span></h2>
   <p class="mut" style="margin:0 0 12px">Still waiting to be generated.</p>
   <div id="availList"></div>
  </div>
 </div>

 <div class="sub" id="v-theme">
  <button class="back" data-open="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> Settings</button>
  <div class="card">
   <h2>Choose a theme</h2>
   <div class="themes" id="themes"></div>
  </div>
 </div>

 <div class="sub" id="v-manage">
  <button class="back" data-open="menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> Settings</button>
  <div class="card">
   <h2>Manage lists</h2>
   <div class="row" style="margin-top:12px">
    <button class="btn alt" id="restoreAll">Move all showed back to available</button>
    <button class="btn warn" id="clearShowed">Clear showed list</button>
    <button class="btn warn" id="clearAll">Delete everything</button>
   </div>
  </div>
 </div>
</section>
</div>

<nav class="tabs">
 <button class="tab on" data-p="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> Home</button>
 <button class="tab" data-p="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg> Settings</button>
</nav>

<script>
(function(){
var KEY="gmailpicker.v2",TKEY="gmailpicker.theme";
var S={available:[],showed:[]};
try{var raw=localStorage.getItem(KEY)||localStorage.getItem("gmailpicker.v1");if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.available)&&Array.isArray(p.showed))S=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var THEMES=[
 {id:"dark",n:"Dark",g:"linear-gradient(135deg,#0f0a25,#7c5cff,#ff4d8d)"},
 {id:"light",n:"Light",g:"linear-gradient(135deg,#f4f1ff,#c9b8ff,#ffb3d1)"},
 {id:"ocean",n:"Ocean",g:"linear-gradient(135deg,#041a2e,#2563eb,#2dd4bf)"},
 {id:"sunset",n:"Sunset",g:"linear-gradient(135deg,#4a1230,#ff5e62,#ffd166)"},
 {id:"forest",n:"Forest",g:"linear-gradient(135deg,#07200f,#16a34a,#a3e635)"},
 {id:"neon",n:"Neon",g:"linear-gradient(135deg,#1a0033,#ff00e5,#00f0ff)"}
];
var theme="dark";
try{var t0=localStorage.getItem(TKEY);if(t0&&THEMES.some(function(t){return t.id===t0}))theme=t0;}catch(e){}
function applyTheme(id){
 theme=id;document.documentElement.setAttribute("data-theme",id);
 try{localStorage.setItem(TKEY,id)}catch(e){}
 var t=THEMES.filter(function(x){return x.id===id})[0];
 $("m-th").textContent=t.n;
 $("themes").innerHTML=THEMES.map(function(x){return '<button class="th'+(x.id===id?' on':'')+'" data-theme="'+x.id+'"><i style="background:'+x.g+'"></i><b>'+x.n+'</b></button>'}).join("");
}
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var re=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
function say(t,k){var m=$("msg");m.textContent=t;m.className="msg "+(k||"")}

function render(){
 var a=S.available.length,s=S.showed.length;
 $("avail").textContent=a;$("shownCount").textContent=s;
 $("sc").textContent=s;$("ac").textContent=a;
 $("m-sc").textContent=s+" showed, latest on top";
 $("m-ac").textContent=a+" waiting";
 $("genBtn").disabled=a===0;
 var ph=$("ph");if(ph)ph.textContent=a?"Your Gmail will appear here":"No Gmail available. Add some from Settings, then Add Gmail.";
 $("showedList").innerHTML=s?S.showed.map(function(e,i){
  return '<div class="item'+(i===0?' latest':'')+'"><span class="n">'+(i+1)+'</span><span class="t">'+esc(e)+'</span><button class="ib" data-a="back" data-i="'+i+'" title="Move back to available" aria-label="Move back to available"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="ib" data-a="delS" data-i="'+i+'" title="Delete" aria-label="Delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>'}).join(""):'<span class="mut">Nothing showed yet. Press Generate on Home.</span>';
 $("availList").innerHTML=a?S.available.map(function(e,i){
  return '<div class="item"><span class="t">'+esc(e)+'</span><button class="ib" data-a="delA" data-i="'+i+'" title="Delete" aria-label="Delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>'}).join(""):'<span class="mut">No Gmail available. Add some first.</span>';
}

$("addBtn").onclick=function(){
 var parts=$("inp").value.split(/[\s,;]+/).map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
 if(!parts.length){say("Paste at least one Gmail address.","err");return}
 var added=0,dup=0,bad=0;
 parts.forEach(function(e){
  if(!re.test(e)){bad++;return}
  if(S.available.indexOf(e)>-1||S.showed.indexOf(e)>-1){dup++;return}
  S.available.push(e);added++;
 });
 save();render();
 if(added)$("inp").value="";
 var t=added+" added";if(dup)t+=", "+dup+" already in a list";if(bad)t+=", "+bad+" invalid (use name@domain.ext)";
 say(t,added?"ok":"err");
};

$("genBtn").onclick=function(){
 if(!S.available.length)return;
 var i=Math.floor(Math.random()*S.available.length);
 var e=S.available.splice(i,1)[0];
 S.showed.unshift(e);
 save();render();
 var r=$("result");
 r.className="result";void r.offsetWidth;r.className="result pop";
 r.innerHTML='<div class="em">'+esc(e)+'</div><div class="mut">'+S.available.length+' Gmail left</div><button class="btn copy" id="cp">Copy</button>';
 $("cp").onclick=function(){
  var done=function(){$("cp").textContent="Copied"};
  function fallback(){var t=document.createElement("textarea");t.value=e;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(z){}document.body.removeChild(t)}
  try{navigator.clipboard.writeText(e).then(done,fallback)}catch(x){fallback()}
 };
};

document.addEventListener("click",function(ev){
 var th=ev.target.closest("[data-theme]");
 if(th&&th.classList.contains("th")){applyTheme(th.dataset.theme);return}
 var o=ev.target.closest("[data-open]");
 if(o){openSub(o.dataset.open);return}
 var b=ev.target.closest("[data-a]");if(!b)return;
 var i=+b.dataset.i,a=b.dataset.a;
 if(a==="delS")S.showed.splice(i,1);
 else if(a==="delA")S.available.splice(i,1);
 else if(a==="back"){S.available.push(S.showed.splice(i,1)[0])}
 save();render();
});
function openSub(n){
 document.querySelectorAll(".sub").forEach(function(s){s.classList.toggle("on",s.id==="v-"+n)});
 window.scrollTo(0,0);
}
$("restoreAll").onclick=function(){S.available=S.available.concat(S.showed.slice().reverse());S.showed=[];save();render()};
$("clearShowed").onclick=function(){if(confirm("Clear the showed list?")){S.showed=[];save();render()}};
$("clearAll").onclick=function(){if(confirm("Delete all Gmail from both lists?")){S={available:[],showed:[]};save();render()}};

document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
 document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===t)});
 document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("on",p.id===t.dataset.p)});
 if(t.dataset.p==="settings")openSub("menu");
 window.scrollTo(0,0);
}});
applyTheme(theme);
render();
})();
</script>
</body>
